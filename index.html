<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#15142b"><title>李嘉朔 · 怪咖格斗</title><link rel="stylesheet" href="style.css"></head>
<body><main class="cabinet"><header><a class="brand" href="./"><span class="brand-icon">怪</span><span>怪咖格斗<small>WEIRDO FIGHT CLUB</small></span></a><div class="tools"><button id="sound" aria-label="开启音效">音效 OFF</button><button id="pause" aria-label="暂停游戏">Ⅱ</button></div></header>
<section class="arena-wrap"><div class="hud"><div class="fighter-info"><div><b>李嘉朔</b><span>THE WEIRDO</span></div><div class="health"><i id="phealth"></i></div></div><div class="round"><small id="round">ROUND 01</small><strong id="timer">60</strong></div><div class="fighter-info opponent"><div><b id="enemyName">纸袋头</b><span>CHALLENGER</span></div><div class="health"><i id="ehealth"></i></div></div></div>
<canvas id="game" width="960" height="540" aria-label="李嘉朔格斗游戏画面"></canvas><div class="stage-label"><i></i><span id="stage">01 / 深夜便利街</span><span>怪一点，也很能打。</span></div><div id="toast" class="toast"></div>
<div id="overlay" class="overlay"><div class="intro"><span class="eyebrow" id="eyebrow">街头怪咖 · 正式出战</span><h1 id="title">李嘉朔<span>今天有点<span class="acid">离谱。</span></span></h1><p id="description">弹簧脑袋、咸鱼领带、大小眼。<br>用最古怪的招式，打穿这条街。</p><button id="start" class="start">开始整活 <span>→</span></button><div class="tags" id="tags"><span>3 位怪咖对手</span><span>触屏即玩</span><span>无需下载</span></div></div></div>
</section><section class="dashboard"><div class="meter-area"><div class="meter-title"><span>离谱能量</span><b id="energyText">0 / 100</b></div><div class="energy"><i id="energy"></i></div><p id="hint">攻击或挨打积攒能量，满格释放离谱旋风。</p></div><div class="desktop-help"><span>移动 <kbd>A</kbd><kbd>D</kbd>　跳跃 <kbd>W</kbd></span><span>怪拳 <kbd>J</kbd>　飞踢 <kbd>K</kbd>　防御 <kbd>L</kbd>　大招 <kbd>U</kbd></span></div><button class="restart" id="restart">↻ 重新挑战</button></section>
<section class="controls" aria-label="触屏游戏操作"><div class="dpad"><button data-action="left" aria-label="向左">◀</button><button data-action="jump" aria-label="跳跃">↟<small>跳跃</small></button><button data-action="right" aria-label="向右">▶</button></div><div class="actions"><button data-action="block" class="block">防御</button><button data-action="punch" class="punch">怪拳<small>J</small></button><button data-action="kick" class="kick">飞踢<small>K</small></button><button data-action="special" class="special">离谱<small>大招</small></button></div></section><footer><span>LI JIASHUO / 怪得很有态度</span><span>原创虚构角色 · 街机挑战</span></footer></main><script src="game.js"></script></body></html>
